<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status do Pedido - TruckGestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/status_pedido.css">
</head>

<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top p-1">
        <div class="container">
        <p class="logonav mb-0 me-2"><img src="../static/img/logo1.jpeg" width="100px" height="100px" alt="logo truckGestão"></p>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow border-0 text-center p-4">
            <h2 class="fw-bold">Acompanhe seu Pedido</h2>
            <p class="text-muted" id="status-text">Aguardando confirmação do restaurante...</p>
            
            <div class="d-flex justify-content-between mt-4 px-2">
                <div class="step-item step-active" id="step-recebido">
                    <div class="step-icon mx-auto"><i class="bi bi-receipt"></i></div>
                    <small class="d-block mt-2 fw-bold">Recebido</small>
                </div>
                <div class="step-line"></div>
                <div class="step-item" id="step-preparo">
                    <div class="step-icon mx-auto"><i class="bi bi-fire"></i></div>
                    <small class="d-block mt-2">Em preparo</small>
                </div>
                <div class="step-line"></div>
                <div class="step-item" id="step-entrega">
                    <div class="step-icon mx-auto"><i class="bi bi-truck"></i></div>
                    <small class="d-block mt-2">Saiu para entrega</small>
                </div>
            </div>

            <hr class="my-4">
            <div class="text-start">
                <h6><strong>Resumo:</strong> <span id="resumo-pedido"></span></h6>
                <p class="mb-0 text-muted">Total: <strong class="text-danger" id="resumo-total"></strong></p>
            </div>
            <a href="acesso_cliente.html" class="btn btn-outline-dark mt-4">Fazer novo pedido</a>
        </div>
    </div>

    <script src="../static/js/status_pedido.js"></script>
</body>
</html>
