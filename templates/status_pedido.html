<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status do Pedido - TruckGestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .step-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #e9ecef; color: #adb5bd; transition: 0.3s; }
        .step-active .step-icon { background: #ffc107; color: #000; box-shadow: 0 0 10px rgba(255, 193, 7, 0.5); }
        .step-line { flex-grow: 1; height: 2px; background: #e9ecef; align-self: center; }
        .step-active + .step-line { background: #ffc107; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow border-0 text-center p-4">
            <h2 class="fw-bold">Acompanhe seu Pedido</h2>
            <p class="text-muted" id="status-text">Aguardando confirmação do restaurante...</p>
            
            <div class="d-flex justify-content-between mt-4 px-2">
                <div class="step-item step-active" id="step-recebido">
                    <div class="step-icon mx-auto"><i class="bi bi-receipt"></i></div>
                    <small class="d-block mt-2 fw-bold">Recebido</small>
                </div>
                <div class="step-line"></div>
                <div class="step-item" id="step-preparo">
                    <div class="step-icon mx-auto"><i class="bi bi-fire"></i></div>
                    <small class="d-block mt-2">Em preparo</small>
                </div>
                <div class="step-line"></div>
                <div class="step-item" id="step-entrega">
                    <div class="step-icon mx-auto"><i class="bi bi-truck"></i></div>
                    <small class="d-block mt-2">Saiu para entrega</small>
                </div>
            </div>

            <hr class="my-4">
            <div class="text-start">
                <h6><strong>Resumo:</strong> <span id="resumo-pedido"></span></h6>
                <p class="mb-0 text-muted">Total: <strong class="text-danger" id="resumo-total"></strong></p>
            </div>
            <a href="acesso_cliente.html" class="btn btn-outline-dark mt-4">Fazer novo pedido</a>
        </div>
    </div>

    <script>
        function atualizarStatus() {
            const pedido = JSON.parse(localStorage.getItem('pedidoFinal'));
            if (!pedido) return;

            document.getElementById('resumo-pedido').innerText = `${pedido.itens.length} itens`;
            document.getElementById('resumo-total').innerText = pedido.total;

            const status = localStorage.getItem('status_pedido') || 'recebido';
            
            if (status === 'preparo') {
                document.getElementById('step-preparo').classList.add('step-active');
                document.getElementById('status-text').innerText = 'O chef já está preparando sua comida!';
            } else if (status === 'entrega') {
                document.getElementById('step-preparo').classList.add('step-active');
                document.getElementById('step-entrega').classList.add('step-active');
                document.getElementById('status-text').innerText = 'Seu pedido saiu para entrega!';
            }
        }
        // Checa por atualizações a cada 3 segundos
        setInterval(atualizarStatus, 3000);
        atualizarStatus();
    </script>
</body>
</html>
