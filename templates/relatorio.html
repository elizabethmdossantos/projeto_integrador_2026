<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - TruckGestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/dashboard.css">
</head>
<body class="bg-light">

    <header class="header bg-white shadow-sm sticky-top py-2">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light p-0">
                <p class="logonav mb-0 me-2"><img src="../static/img/logo1.jpeg" width="100px" height="100px" alt="logo"></p>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link text-muted px-3" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active fw-bold px-3" href="relatorio.html">Relatórios</a></li>
                        <li class="nav-item"><a href="index.html" class="btn btn-outline-danger btn-sm ms-2">Sair</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold text-dark">Relatório de Vendas</h1>
                <p class="text-secondary">Análise detalhada do desempenho de hoje.</p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 border-start border-success border-4">
                    <p class="text-muted mb-1 small fw-bold">FATURAMENTO DO DIA</p>
                    <h2 class="fw-bold text-success" id="faturamento-dia">R$ 0,00</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 border-start border-primary border-4">
                    <p class="text-muted mb-1 small fw-bold">TOTAL DE PEDIDOS</p>
                    <h2 class="fw-bold text-primary" id="total-pedidos">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-4"><i class="bi bi-graph-up-arrow me-2 text-danger"></i>Produtos Mais Vendidos</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="tabela-mais-vendidos">
                            <thead class="table-light">
                                <tr>
                                    <th>Produto</th>
                                    <th class="text-center">Qtd. Vendida</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="relatorio.js"></script>
</body>
</html>
